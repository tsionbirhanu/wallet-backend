services:
  - type: web
    name: wallet-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerCommand: /bin/sh -c "npm run migrate && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: SMSETHIOPIA_API_KEY
        sync: false
      - key: PUSH_PROVIDER
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
